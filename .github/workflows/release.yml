name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: 0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Definir versão
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Empacotar para Windows
        run: build/package-windows.sh "$VERSION"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/TudoMKV-$VERSION-win-x64.zip" \
            --target "$GITHUB_SHA" \
            --title "TudoMKV $VERSION" \
            --notes-file build/release-notes.md
