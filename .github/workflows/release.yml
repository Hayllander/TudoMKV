name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: 0.4.6)"
        required: true

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Definir versão
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Empacotar para Windows
        run: build/package-windows.sh "$VERSION"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/TudoMKV-$VERSION-win-x64.zip" \
            --target "$GITHUB_SHA" \
            --title "TudoMKV $VERSION" \
            --notes-file build/release-notes.md

  # O instalador é montado com o NSIS (makensis), que só existe no Windows, e é anexado ao
  # release que o job acima acabou de criar.
  windows-installer:
    needs: windows-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Instalar o NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
          }

      - name: Gerar o instalador com o NSIS
        shell: pwsh
        run: build/package-installer.ps1 -Version "${{ needs.windows-package.outputs.version }}"

      - name: Anexar o instalador ao release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.windows-package.outputs.version }}" `
            "dist/TudoMKV-${{ needs.windows-package.outputs.version }}-setup.exe" --clobber
