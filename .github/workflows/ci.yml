name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffmpeg: ffmpeg-master-latest-linux64-gpl
            archive: tar.xz
          - os: windows-latest
            ffmpeg: ffmpeg-master-latest-win64-gpl-shared
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Mesma família de builds que vai no executável: tem libdvdnav e libbluray.
      - name: Baixar FFmpeg
        shell: bash
        run: |
          curl -fsSL -o "ffmpeg.${{ matrix.archive }}" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg }}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == zip ]]; then unzip -q ffmpeg.zip; else tar xf ffmpeg.tar.xz; fi
          echo "TUDOMKV_FFMPEG_DIR=$PWD/${{ matrix.ffmpeg }}/bin" >> "$GITHUB_ENV"

      - name: Instalar ferramentas para o DVD de teste (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dvdauthor genisoimage

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build
